<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1> Dashboard </h1>
    {% if files %}
        <ul>
            {% for file in files %}
                <li>{{ file }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No data</p>
    {% endif %}
    <hr>
    <h3>upload file</h3>
    <form action="/upload" method  = "post" enctype="multipart/form-data">
        <input type="file" name = "file" required>
        <button type = "submit">Upload</button>
    </form>
</body>
</html>
