<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1> Dashboard </h1>
    {% if files %}
        <ul id="fileList">
            {% for file in files %}
                <li><a href="/download/{{ file }}" class = "downloadLink">{{ file }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No data</p>
    {% endif %}
    <hr>
    <h3>upload file</h3>
    <form action="/upload" method  = "post" enctype="multipart/form-data" id="uploadForm">
        <input type="file" name = "file" id = "file" required>
        <button type = "submit">Upload</button>
    </form>
<script>
    async function restoreKey() {
        const jwkString = sessionStorage.getItem("encryptionKey");
        if (!jwkString) {
            alert("No encryption key found in session. Please log in again.");
            window.location.href = "/";
            return;
        }
        try {
            const jwk = JSON.parse(jwkString);
            window.encryptionKey = await crypto.subtle.importKey(
                "jwk",
                jwk,
                { name: "AES-GCM" },
                true,
                ["encrypt", "decrypt"]
            );
        } catch (error) {
            console.error("Failed to restore encryption key:", error);
            alert("Error restoring encryption key. Please log in again.");
            window.location.href = "/";
        }
    }
    restoreKey();

    const uploadForm = document.getElementById('uploadForm');
    const fileInput = document.getElementById('file');
    const fileList = document.getElementById('fileList');
    uploadForm.addEventListener('submit', async(event)=>{
        event.preventDefault();
        if(fileInput.files.length===0) {
            alert("no file selected");
            return;
        }
    const file = fileInput.files[0];
        const encryptionKey = window.encryptionKey;
        if(!encryptionKey) {
            alert("enc key not found");
            return;
        }
        try{
            const fileBuffer = await file.arrayBuffer();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encryptedFileBuffer = await crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: iv,
                },
                encryptionKey,
                fileBuffer
            );
            const combinedBuffer = new Blob([iv, new Uint8Array(encryptedFileBuffer)]);
            const formData = new FormData();
            formData.append('file', combinedBuffer, file.name);
            const response = await fetch('/upload', {method: 'POST', body: formData});
            if(response.ok) {
                window.location.reload();
            } else {
                alert("upload failed");
            }
        }catch(error){
            alert("error during encryption or upload");
        }
    })
    fileList.addEventListener('click', async(event)=>{
        if(event.target.classList.contains('downloadLink')){
            event.preventDefault();
            const link = event.target;
            const downloadUrl = link.getAttribute('href');
            const filename = link.textContent;
            const encryptionKe = window.encryptionKey;
            if (!encryptionKe) {
                alert("enc key not found");
                return;
            }
            try{
                const response = await fetch(downloadUrl);
                if(!response.ok){
                    throw new Error('error after fetch(downloadUrl');
                }
                const blob = await response.blob();
                const fileBuffer = await blob.arrayBuffer();
                const iv = fileBuffer.slice(0,12);
                const encryptedData = fileBuffer.slice(12);
                const decryptedBuffer = await crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv,
                    },
                    encryptionKe,
                    encryptedData
                );
                const decryptedBlob=new Blob([decryptedBuffer]);
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(decryptedBlob);
                downloadLink.download = filename;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            }catch(error){
                alert("error during encryption/download");                    }


        }
    });
</script>
</body>
</html>
