<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>qs</title>
</head>
<body>
    <form action = "/login" method = "post" id="login-form">
        <h2>
            Login
        </h2>
        <input type = "text" name = "username" id="username" placeholder = "Username" required>
        <input type = "password" name = "password" id="password" placeholder = "Password" required>
        <button type = "submit">Log In</button>
    </form>
    <hr>
    <form action = "/login" method = "post" id="signup-form">
        <h2>
            Sign Up
        </h2>
        <input type = "text" name = "username" id="signup-username" placeholder = "Username" required>
        <input type = "password" name = "password" id="signup-password" placeholder = "Password" required>
        <button type = "submit">Sign Up</button>
    </form>
<script>
    async function deriveKey(password, salt){
        const encoder = new TextEncoder();
        const encodedPassword = encoder.encode(password);

        const base = await crypto.subtle.importKey(
            "raw",encodedPassword,{name:"PBKDF2"},false,["deriveKey"]
        );
        const params = {
            name: "PBKDF2",
            salt: salt,
            iterations: 99999,
            hash: "SHA-256"
        };
        const encryptionKey = await crypto.subtle.deriveKey(
            params,
            base,
            { name: "AES-GCM", length: 256},
            true,
            ["encrypt", "decrypt"]
        );
        return encryptionKey;
    }
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async(event)=>{
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const salt = new TextEncoder().encode("tmpSalt");
        
        try {
            const derivedKey = await deriveKey(password, salt);
            const exportedKey = await crypto.subtle.exportKey("jwk", derivedKey);
            sessionStorage.setItem("encryptionKey", JSON.stringify(exportedKey));
            
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('action', 'login');
            
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });
            
            if (response.ok) {
                window.location.href = "/dashboard";
            } else {
                const errMsg = await response.text();
                alert("Login failed: " + errMsg);
            }
        } catch(error) {
            console.error("key derivation or login failed:", error);
            alert("An error occurred during authentication.");
        }
    });

    const signupForm = document.getElementById('signup-form');
    signupForm.addEventListener('submit', async(event)=>{
        event.preventDefault();
        const username = document.getElementById('signup-username').value;
        const password = document.getElementById('signup-password').value;
        const salt = new TextEncoder().encode("tmpSalt");
        
        try {
            const derivedKey = await deriveKey(password, salt);
            const exportedKey = await crypto.subtle.exportKey("jwk", derivedKey);
            sessionStorage.setItem("encryptionKey", JSON.stringify(exportedKey));
            
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('action', 'register');
            
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });
            
            if (response.ok) {
                window.location.href = "/dashboard";
            } else {
                const errMsg = await response.text();
                alert("Sign Up failed: " + errMsg);
            }
        } catch(error) {
            console.error("key derivation or sign up failed:", error);
            alert("An error occurred during registration.");
        }
    });
</script>
</body>
</html>
